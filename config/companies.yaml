# ==============================================================================
# Company career board tokens — used by src/sources/greenhouse.py, lever.py,
# ashby.py to pull postings directly from each company's public ATS API.
# No login needed, fully ToS-compliant (these are public read-only endpoints).
# ==============================================================================
#
# HOW THIS WORKS:
#   Greenhouse: boards-api.greenhouse.io/v1/boards/<TOKEN>/jobs
#   Lever:      api.lever.co/v0/postings/<TOKEN>
#   Ashby:      api.ashbyhq.com/posting-api/job-board/<TOKEN>
#
# VERIFIED (Part 2, this build pass):
#   Every token below was hit live against its API. The original starter
#   list's entire `lever` section (14 tokens) 404'd -- those companies don't
#   publish a public Lever board under those names anymore (e.g. netflix and
#   github now run their own custom career sites). They've been removed and
#   replaced with real, currently-live tokens.
#
#   The new companies added across all three platforms were not guessed --
#   they were discovered organically by the Google `site:` search scraper
#   (src/scrapers/google_ats.py) and each one already returned real posting
#   data in an actual run, which is stronger evidence than a bare 200 status.
#
#   NOT included: `jobgether` (jobs.lever.co/jobgether) -- it returned 4,457
#   postings, far more than a real single employer would have. It's a job
#   aggregator republishing other companies' listings under its own Lever
#   board, not a direct employer. Leaving it out of direct-pull config;
#   flagged separately for Part 3e/4 dedup since it's already sitting in
#   data/jobs_seen.json from the discovery scraper.
#
#   This list is still a STARTER, not a ceiling -- the Google `site:` search
#   scraper is what makes company coverage open-ended going forward.
#
# ==============================================================================

